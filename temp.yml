# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Scoreboard
#
# Port of the RavenCore scoreboard module (bukkit/src/main/resources/scoreboard/config.yml)
# into TAB. Goes in plugins/TAB/config.yml.
#
# TAB picks the FIRST board whose display-condition passes, so "admin" must stay above
# "default" — that is how the old priority: 100 / priority: 0 pair is reproduced.
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: true
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
    admin:
      title: "&#FF2B2B&lRaven SMP"
      display-condition: "permission:raven.scoreboard.admin"
      lines:
        - ""
        - "&#33FF66⚙ &#FFFFFFTPS &#33FF66%tps%"
        - "&#FF9F1C◷ &#FFFFFFMSPT &#FF9F1C%mspt%"
        - "&#4CC9F0⌁ &#FFFFFFPing &#4CC9F0%ping%ms"
        - "&#A855F7◆ &#FFFFFFCPU &#A855F7%ravenserver_cpu%"
        - "&#D90429▼ &#FFFFFFLow TPS Region &#D90429%ravenserver_region_tps_low%"
        - "&#FFD447◆ &#FFFFFFMid TPS Region &#FFD447%ravenserver_region_tps_mid%"
        - ""
        - "&#33FF66$ &#FFFFFFMoney &#33FF66%ravencore_money%"
        - "&#D90429✦ &#FFFFFFRavs &#D90429%stats_ravs%"
        - "&#00D5FF⌛ &#FFFFFFOnline &#00D5FF%ravenserver_network_online%"
        - "&#FFD447☻ &#FFFFFFPlaytime &#FFD447%stats_play_time%"
        - "&#3A86FF⚑ &#FFFFFFTeam &#3A86FF%raven_team%"
        - ""
        - "&#7A7A7A%ravenserver_server_display% &#4CC9F0(%ping%ms)"
    default:
      title: "&#FF2B2B&lRaven SMP"
      lines:
        - ""
        - "&#33FF66$ &#FFFFFFMoney &#33FF66%ravencore_money%"
        - "&#D90429✦ &#FFFFFFRavs &#D90429%stats_ravs%"
        - "&#FF5555⚔ &#FFFFFFKills &#FF5555%stats_kills%"
        - "&#FF9F1C☠ &#FFFFFFDeaths &#FF9F1C%stats_deaths%"
        - "&#00D5FF⌛ &#FFFFFFKeyall &#00D5FF%ravenserver_network_online%"
        - "&#FFD447☻ &#FFFFFFPlaytime &#FFD447%stats_play_time%"
        - "&#3A86FF⚑ &#FFFFFFTeam &#3A86FF%raven_team%"
        - ""
        - "&#7A7A7A%ravenserver_server_display% &#4CC9F0(%ping%ms)"
