# Whether to play a sound to the player when they send a link command.
play-sound: true
# Namespaced sound key played on discord/store, e.g. "minecraft:entity.player.levelup".
sound: "minecraft:entity.player.levelup"

link-sent: "&7The link has been sent in chat!"

discord:
  - "&7Join our Discord community"
  - "&7&l•&r &7&ndiscord.gg/example"

