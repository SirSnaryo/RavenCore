# RavenCore Velocity command visibility.
#
# Inspired by proven command whitelist / anti-tab plugins: keep a small visible
# command set per group, hide plugin namespace commands, and block hidden command
# execution when strict mode is enabled.

enabled: true
bypass-permission: "raven.proxycommandfilter.bypass"
deny-message: "&#D90429This command is not available."

# When true, unknown commands seen in Velocity's available command tree are
# learned into the default group. This lets backend plugin commands appear
# naturally without manually copying every command after installing a plugin.
auto-discover:
  enabled: true
  target-group: "default"
  save-to-config: false

# Only these commands may be learned into the default group automatically.
# Everything else must be added intentionally with /ravencorevelo tab add.
safe-auto-discover-commands:
  - "discord"
  - "store"
  - "rules"
  - "help"
  - "lobby"
  - "hub"
  - "msg"
  - "w"
  - "tell"
  - "pm"
  - "message"
  - "r"
  - "reply"
  - "media"
  - "baltop"
  - "balancetop"
  - "baltops"
  - "balance"
  - "bal"
  - "money"

strict-execution: true
block-namespace-commands: true
namespace-bypass-permission: "raven.proxycommandfilter.namespace"

blocked-commands:
  - "server"
  - "queue"
  - "pl"
  - "plugins"
  - "bukkit:pl"
  - "bukkit:plugins"
  - "version"
  - "ver"
  - "about"
  - "icanhasbukkit"
  - "minecraft:help"
  - "bukkit:help"

# These commands are never allowed in the default tab list, even if an older
# config learned them before this filter became strict.
reserved-default-commands:
  - "ravencore"
  - "rc"
  - "ravencorevelo"
  - "rcvelo"
  - "ravenauction"
  - "ravenauctionadmin"
  - "auctionadmin"
  - "cratemanager"
  - "statsmanager"
  - "combatmanager"
  - "billfordpreset"
  - "setspawn"
  - "setafk"
  - "tool"
  - "worldedit"
  - "we"
  - "brush"
  - "br"
  - "wand"
  - "pos1"
  - "pos2"
  - "hpos1"
  - "hpos2"
  - "copy"
  - "paste"
