  - "cyl"
  - "hcyl"
  - "pyramid"
  - "hpyramid"
  - "drain"
  - "fixwater"
  - "fixlava"
  - "region"
  - "rg"
  - "lp"
  - "luckperms"
  - "op"
  - "deop"
  - "ban"
  - "ban-ip"
  - "pardon"
