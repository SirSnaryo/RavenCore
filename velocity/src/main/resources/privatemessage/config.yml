# Permission required to use /msg and /r. Leave blank to allow every player.
permission: ""

format:
  sent: "&7[You -> &f%target%&7]: &f%message%"
  received: "&7[&f%sender%&7 -> You]: &f%message%"

no-permission: "&cYou don't have permission to use private messages."
usage: "&cUsage: %usage%"
