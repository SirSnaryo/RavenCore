plugins {
    id 'com.gradleup.shadow'
    id 'xyz.jpenilla.run-paper'
}

repositories {
    maven { url = 'https://jitpack.io' }
}

dependencies {
    implementation project(':common')

    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'com.mojang:authlib:3.13.56'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation 'de.tr7zw:item-nbt-api:2.15.5'
    implementation 'fr.mrmicky:fastboard:2.1.5'
    implementation 'com.zaxxer:HikariCP:5.0.1'
    implementation('com.mysql:mysql-connector-j:8.3.0') {
        exclude group: 'com.google.protobuf'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('RavenCore-Bukkit')
    archiveVersion.set('')
    relocate 'redis.clients',              'com.kammoun.raven.libs.jedis'
    relocate 'org.apache.commons.pool2',   'com.kammoun.raven.libs.pool2'
    relocate 'org.slf4j',                  'com.kammoun.raven.libs.slf4j'
    relocate 'de.tr7zw.changeme.nbtapi',   'com.kammoun.raven.libs.nbtapi'
    relocate 'fr.mrmicky.fastboard',       'com.kammoun.raven.libs.fastboard'
}

tasks.named('jar') {
    archiveVersion.set('')
}

def deployDirs = [
    'C:/Users/Kammoun/Desktop/RavenMC',
    'C:/Users/Kammoun/Desktop/RavenMC/SMP-Spawn-1/plugins',
    'C:/Users/Kammoun/Desktop/RavenMC/SMP-Spawn-2/plugins',
    'C:/Users/Kammoun/Desktop/RavenMC/SMP-Spawn-3/plugins',
]

tasks.register('deploy') {
    dependsOn shadowJar
    doLast {
        deployDirs.each { dir ->
            copy {
                from shadowJar.archiveFile
                into dir
            }
        }
    }
}

assemble.dependsOn shadowJar

processResources {
    filesMatching('plugin.yml') {
        expand version: project.version
    }
    filteringCharset = 'UTF-8'
}
