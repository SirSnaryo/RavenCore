# Player-facing /billford menu.
gui:
  title: "&8Billford"
  size: 54

  # Reserved display positions for the preset's required items.
  # Unused positions remain empty and are never covered by filler.
  required-items-slots: [10, 11, 12, 19, 20, 21, 28, 29, 30]
  trade-slot: 25

  confirm-item:
    slot: 40
    material: LIME_CONCRETE
    name: "&#33FF66&lConfirm Trade"
    lore:
      - "&#7A7A7AConfirm"
      - "&#4CC9F0Hand in items and receive your reward."
    glow: true

  info-item:
    slot: 4
    material: BOOK
    name: "&#4CC9F0&lTrade Info"
    lore:
      - "&#7A7A7ATrade"
      - "&#FFFFFFYou give:"
      - "%required_item%"
      - " "
      - "&#FFFFFFYou receive:"
      - "&#7A7A7A• &#FFFFFF%item%"

  filler:
    item:
      material: BLACK_STAINED_GLASS_PANE
      name: " "

# Administrative /billfordpreset create|edit menu.
editor:
  title: "&8Editing: %preset%"
  size: 54
  required-items-slots: [10, 11, 12, 19, 20, 21, 28, 29, 30]
  trade-slot: 25
  save-slot: 49
  info-slot: 4

  info-item:
    material: BOOK
    name: "&#FFD447&lPreset Editor"
    lore:
      - "&#7A7A7AEditor"
      - "&#7A7A7APlace the &#FFFFFFrequired items"
      - " "
      - "&#7A7A7APlace the &#FFFFFFreward item"
      - "&#7A7A7Ain the right slot."
      - " "
      - "&#7A7A7AClick &#33FF66SAVE &#7A7A7Awhen done."

  save-item:
    material: LIME_CONCRETE
    name: "&#33FF66&lSAVE PRESET"
    lore:
      - "&#7A7A7ASave"
      - "&#4CC9F0Save this preset network-wide."
    glow: true

  required-placeholder:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "&#7A7A7ARequired Item Slot"
    lore:
      - "&#7A7A7ARequired"

  reward-placeholder:
    material: YELLOW_STAINED_GLASS_PANE
    name: "&#FFD447Reward Item Slot"
    lore:
      - "&#7A7A7AReward"

  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
