# Random-location pool generation settings for this server.
location-library:
  # How many prepared locations each server keeps per dimension.
  pool-target-size: 50

  # Maximum successful locations generated per refill cycle.
  # Keeps chunk generation smooth instead of filling a drained pool in one burst.
  max-refill-per-cycle: 10

  # Hard cap for candidate chunk/column checks per dimension per cycle.
  # This prevents bad bounds or ocean-heavy worlds from growing async work forever.
  max-attempts-per-cycle: 250

  # How often the asynchronous refill controller checks each pool.
  refill-interval-seconds: 45
  nether-pool-enabled: true
  use-grid-xz-bounds: true

  # Absolute search bounds. Minimum values are inclusive and maximum values
  # are exclusive. With use-grid-xz-bounds enabled, survival X/Z are derived
  # from the main RavenCore grid cell, origin, and border safety margin. That
  # lets every server use the same file without Server 2 generating Server 1
  # locations. In that mode only min.y/max.y are used for overworld/nether.
  # Set use-grid-xz-bounds false only when manually managing per-server bounds.
  bounds:
    overworld:
      min: { x: -24700, y: -64, z: -24700 }
      max: { x: 24700, y: 320, z: 24700 }
    nether:
      min: { x: -3087, y: 5, z: -3087 }
      max: { x: 3087, y: 120, z: 3087 }
    end:
      min: { x: -5000, y: 1, z: -5000 }
      max: { x: 5000, y: 255, z: 5000 }

  blacklisted-blocks:
    - WATER
    - LAVA
    - BUBBLE_COLUMN
    - SEAGRASS
    - TALL_SEAGRASS
    - KELP_PLANT
    - CACTUS
    - BEDROCK
    - KELP
    - MAGMA_BLOCK
    - FIRE
    - SOUL_FIRE
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - POWDER_SNOW
    - SWEET_BERRY_BUSH
    - WITHER_ROSE
    - OAK_LEAVES
    - SPRUCE_LEAVES
    - BIRCH_LEAVES
    - JUNGLE_LEAVES
    - ACACIA_LEAVES
    - DARK_OAK_LEAVES
    - MANGROVE_LEAVES
    - CHERRY_LEAVES
    - PALE_OAK_LEAVES

  blacklisted-biomes:
    - BEACH
    - RIVER
    - FROZEN_RIVER
    - OCEAN
    - DEEP_OCEAN
    - COLD_OCEAN
    - DEEP_COLD_OCEAN
    - LUKEWARM_OCEAN
    - DEEP_LUKEWARM_OCEAN
    - WARM_OCEAN
    - FROZEN_OCEAN
    - DEEP_FROZEN_OCEAN
