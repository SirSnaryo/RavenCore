# Target server names as registered in your Velocity config.
# The Nether has no entry here anymore — it's now local to each survival server
# (Minecraft's normal 1:8 dimension ratio), not a separate dedicated server.
servers:
  end: smp-end

# Each survival server and the coordinate region it covers.
# Adjacent regions sharing an edge will automatically have a virtual border between them —
# both in the Overworld and, at 1/8 scale, in each region's local Nether.
overworld-regions:
  smp-world-na:
    server: smp-world-na
    min-x: -20000
    max-x:  0
    min-z: -20000
    max-z:  20000
  smp-world-eu:
    server: smp-world-eu
    min-x:  0
    max-x:  20000
    min-z: -20000
    max-z:  20000

# Virtual border settings (applies to all derived region borders).
border:
  # How close (in blocks) a player must be to see the particle wall.
  detection-distance: 30
  # Vertical spacing between particle rows in the wall.
  particle-spacing: 1.5
  # How many blocks tall the particle wall is.
  wall-height: 50
  # Any Bukkit Particle enum value.
  particle: DUST_PLUME
  # Sent when a player tries to break or place a block past the border.
  deny-message: ""
