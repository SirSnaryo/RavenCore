  raven.chat.bypass.length:
    description: Bypass max chat length
    default: op
  raven.core.admin:
    description: Reload RavenCore modules
    default: op
  raven.billford:
    description: Open the Billford trade menu
    default: true
  raven.billford.admin:
    description: Manage Billford trade presets
    default: op
  raven.stats:
    description: View your own player statistics
