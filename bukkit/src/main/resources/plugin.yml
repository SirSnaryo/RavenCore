    default: op
  raven.teleport.tpa:
    description: Use TPA requests and personal teleport settings
    default: true
  raven.speed:
    description: Change your current walk or fly speed
    default: op
  raven.settings:
    description: Open and change personal settings
    default: true
  raven.clearinventory.self:
    description: Clear your own inventory
    default: op
  raven.clearinventory.others:
    description: Clear another player's inventory
    default: op
  raven.economy.balance:
    description: Check own balance
    default: true
  raven.economy.balance.others:
    description: Check other players' balances
    default: op
  raven.economy.pay:
    description: Pay other players
    default: true
  raven.economy.admin:
    description: Admin economy commands (give, take, set, reset)
