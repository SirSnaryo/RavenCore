name: RavenCore
version: '${version}'
main: com.kammoun.raven.RavenCore
api-version: '1.21'
folia-supported: true
softdepend: [PlaceholderAPI, WorldGuard, RavenSell, Ravs, HuskSync]
depend: [Vault]
load: POSTWORLD
commands:
  mythictools:
    description: Manage Mythic Tools
    usage: /mythictools <give|selfdestruct|list|reload>
    aliases: [mythictool]
    permission: raven.mythictools.admin
    permission-message: You don't have permission to use this command.
  balance:
    description: Check your balance or another player's balance
    usage: /balance [player]
    aliases: [bal, money]
    permission: raven.economy.balance
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  pay:
    description: Pay another online player
    usage: /pay <player> <amount>
    permission: raven.economy.pay
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  paytoggle:
    description: Toggle receiving player payments
    usage: /paytoggle
    permission: raven.economy.pay
    permission-message: You don't have permission to use this command.
  paymsg:
    description: Toggle economy payment messages
    usage: /paymsg
    aliases: [paymessages]
    permission: raven.economy.pay
    permission-message: You don't have permission to use this command.
  eco:
    description: Admin economy management
    usage: /eco <give|take|set|reset|log|logs> <player> [amount] [reason]
    aliases: [economy]
    permission: raven.economy.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  tp:
    description: Teleport yourself or another player to a player
    usage: /tp <player> | /tp <player> <player> | /tp <x> <y> <z> [server] | /tp <player> <x> <y> <z> [server]
    aliases: [teleport]
    permission: raven.teleport
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  tphere:
    description: Teleport a network player to you
    usage: /tphere <player>
    aliases: [tph]
    permission: raven.teleport
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.


  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpahere:
    description: Request a player to teleport to you
    usage: /tpahere <player>
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpaccept:
    description: Accept a pending TPA request
    usage: /tpaccept [player]
    aliases: [tpyes]
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpadeny:
    description: Deny a pending TPA request
    usage: /tpadeny [player]
    aliases: [tpdeny, tpno]
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpacancel:
    description: Cancel outgoing TPA requests
    usage: /tpacancel
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpatoggle:
    description: Toggle receiving TPA requests
    usage: /tpatoggle
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpaheretoggle:
    description: Toggle receiving TPAHere requests
    usage: /tpaheretoggle
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpauto:
    description: Toggle automatic TPA acceptance
    usage: /tpauto
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  speed:
    description: Set your current movement speed
    usage: /speed <0-10>
    permission: raven.speed
    permission-message: You don't have permission to change speed.

  settings:
    description: Open your player settings
    usage: /settings
    aliases: [setting, prefs, preferences]
    permission: raven.settings
    permission-message: You don't have permission to use this command.
  chattoggle:
    description: Toggle receiving public chat messages
    usage: /chattoggle
    aliases: [togglechat]
    permission: raven.chat
    permission-message: You don't have permission to use this command.
  broadcasttoggle:
    description: Toggle receiving Raven auto broadcast messages
    usage: /broadcasttoggle
    aliases: [btoggle, togglebroadcast]
    permission: raven.chat
    permission-message: You don't have permission to use this command.
  clear:
    description: Clear your own or another player's inventory
    usage: /clear [player]
    aliases: [ci, clearinv, clearinventory]
    permission: raven.clearinventory.self
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  spawn:
    description: Open the spawn server selection menu
    usage: /spawn
    permission: raven.spawn
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  afk:
    description: Open the AFK server selection menu
    usage: /afk
    permission: raven.afk
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  setspawn:
    description: Set this server's spawn location to your current position
    usage: /setspawn
    permission: raven.setspawn
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  setafk:
    description: Set this server's AFK location to your current position
    usage: /setafk
    permission: raven.setafk
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  rtp:
    description: Teleport to a random location
    usage: /rtp
    permission: raven.rtp
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  rtpq:
    description: Join or leave the RTP matchmaking queue
    usage: /rtpq
    aliases: [rtpqueue]
    permission: raven.rtp.queue
    permission-message: You don't have permission to use RTP Queue.

  home:
    description: Open your homes or teleport to a named home
    usage: /home [name]
    permission: raven.home
    permission-message: You don't have permission to use homes.
  homes:
    description: Open your homes
    usage: /homes
    permission: raven.home
    permission-message: You don't have permission to use homes.
  sethome:
    description: Set a network-wide home
    usage: /sethome [name]
    permission: raven.home.set
    permission-message: You don't have permission to set homes.
  delhome:
    description: Delete a named home
    usage: /delhome <name>
    aliases: [deletehome, removehome]
    permission: raven.home.delete
    permission-message: You don't have permission to delete homes.

  team:
    description: Manage your network-wide team
    usage: /team [create|invite|accept|deny|leave|kick|disband|home|sethome|deletehome|chat|invites|pvp]
    aliases: [teams, clan]
    permission: raven.team
    permission-message: You don't have permission to use teams.

  combatmanager:
    description: Manage network combat tags
    usage: /combatmanager <tag|untag> <player> [opponent]
    aliases: [combatmgr, combatadmin]
    permission: raven.combat.admin
    permission-message: You don't have permission to manage combat tags.

  shop:
    description: Open the server shop
    usage: /shop [category|reload]
    permission: raven.shop
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  spawner:
    description: Manage and give spawner items
    usage: /spawner <give|list|reload>
    permission: raven.spawner.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  billford:
    description: Open the Billford trade menu
    usage: /billford
    permission: raven.billford
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  billfordpreset:
    description: Manage Billford trade presets
    usage: /billfordpreset <create|edit|delete|switch|list|info|reload> [name]
    aliases: [bfpreset]
    permission: raven.billford.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  stats:
    description: View network-wide player statistics
    usage: /stats [player]
    permission: raven.stats
    permission-message: You don't have permission to view stats.
  statsmanager:
    description: Manage network-wide player statistics
    usage: /statsmanager <set|add|remove|reset|reload> [player] [stat] [amount]
    aliases: [statsadmin]
    permission: raven.stats.admin
    permission-message: You don't have permission to manage stats.
  leaderboard:
    description: Open cached network leaderboards
    usage: /leaderboard [type|refresh]
    aliases: [leaderboards, leaderboaord, lb, top]
    permission: raven.leaderboard
    permission-message: You don't have permission to view leaderboards.
  baltop:
    description: Open the network-wide balance leaderboard
    usage: /baltop
    aliases: [baltops, baltop, balancetop]
    permission: raven.leaderboard
    permission-message: You don't have permission to view leaderboards.
  crates:
    description: Manage and open virtual-key crates
    usage: /crates <list|setblock|give|set|reload|time>
    aliases: [crate, cratemanager]
    permission: raven.crates
    permission-message: You don't have permission to use crates.

  nv:
    description: Toggle permanent night vision
    usage: /nv
    aliases: [nightvision]
    permission: raven.nightvision
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  bordermanager:
    description: Inspect and manage this server border cell
    usage: /bordermanager <info|view|tp|setcell|setorigin|reload>
    aliases: [boardermanager, bmanager, bm]
    permission: raven.borders.admin
    permission-message: You don't have permission to manage borders.

  staffmode:
    description: Toggle Raven staff mode
    usage: /staffmode
    aliases: [stmode]
    permission: raven.staffmode
    permission-message: You don't have permission to use staff mode.

  vanish:
    description: Toggle Raven vanish
    usage: /vanish
    permission: raven.vanish
    permission-message: You don't have permission to use vanish.

  endsee:
    description: Inspect a player's Ender Chest
    usage: /endsee <player> [edit]
    permission: raven.staffmode.enderchest.view
    permission-message: You don't have permission to inspect Ender Chests.

  echest:
    description: Inspect a player's Ender Chest
    usage: /echest <player> [edit]
    permission: raven.staffmode.enderchest.view
    permission-message: You don't have permission to inspect Ender Chests.

  invsee:
    description: Inspect a player's inventory while in staff mode
    usage: /invsee <player> [edit]
    permission: raven.staffmode.invsee.view
    permission-message: You don't have permission to inspect inventories.

  ban:
    description: Ban a player from the Raven network
    usage: /ban <player> [duration] [reason]
    permission: raven.punishment.ban
    permission-message: You don't have permission to ban players.

  tempban:
    description: Temporarily ban a player from the Raven network
    usage: /tempban <player> <duration> [reason]
    permission: raven.punishment.ban
    permission-message: You don't have permission to ban players.

  unban:
    description: Remove an active player ban
    usage: /unban <player>
    permission: raven.punishment.unban
    permission-message: You don't have permission to unban players.

  mute:
    description: Mute a player from public chat
    usage: /mute <player> [duration] [reason]
    permission: raven.punishment.mute
    permission-message: You don't have permission to mute players.

  tempmute:
    description: Temporarily mute a player from public chat
    usage: /tempmute <player> <duration> [reason]
    permission: raven.punishment.mute
    permission-message: You don't have permission to mute players.

  unmute:
    description: Remove an active player mute
    usage: /unmute <player>
    permission: raven.punishment.unmute
    permission-message: You don't have permission to unmute players.

  kick:
    description: Kick a player from this server
    usage: /kick <player> [reason]
    permission: raven.punishment.kick
    permission-message: You don't have permission to kick players.

  warn:
    description: Warn a player and store it in punishment history
    usage: /warn <player> [reason]
    permission: raven.punishment.warn
    permission-message: You don't have permission to warn players.

  history:
    description: Show a player's punishment history
    usage: /history <player>
    permission: raven.punishment.history
    permission-message: You don't have permission to view punishment history.

  punish:
    description: Open or run Raven punishment actions
    usage: /punish <player> <ban|mute|kick|warn|history> [duration] [reason]
    permission: raven.punishment.use
    permission-message: You don't have permission to punish players.

  devmode:
    description: Toggle Raven developer diagnostics mode
    usage: /devmode
    permission: raven.devmode
    permission-message: You don't have permission to use dev mode.

  ravencore:
    description: RavenCore version and safe module reload
    usage: /ravencore <version|modules|memory|reload>
    aliases: [rcore]
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

permissions:
  raven.mythictools.admin:
    description: Manage Mythic Tools
    default: op
  raven.teleport:
