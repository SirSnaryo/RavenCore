name: RavenCore
version: '${version}'
main: com.kammoun.raven.RavenCore
api-version: '1.21'
folia-supported: true
softdepend: [PlaceholderAPI, WorldGuard]
depend: [Vault]
load: STARTUP
commands:
  balance:
    description: Check your balance or another player's balance
    usage: /balance [player]
    aliases: [bal, money]
    permission: raven.economy.balance
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  pay:
    description: Pay another online player
    usage: /pay <player> <amount>
    permission: raven.economy.pay
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  eco:
    description: Admin economy management
    usage: /eco <give|take|set|reset> <player> [amount]
    aliases: [economy]
    permission: raven.economy.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  tp:
    description: Teleport yourself or another player to a player
    usage: /tp <player> | /tp <player> <player> | /tp <x> <y> <z> [server] | /tp <player> <x> <y> <z> [server]
    aliases: [teleport]
    permission: raven.teleport
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  tphere:
    description: Teleport a network player to you
    usage: /tphere <player>
    aliases: [tph]
    permission: raven.teleport
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.


  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpahere:
    description: Request a player to teleport to you
    usage: /tpahere <player>
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpaccept:
    description: Accept a pending TPA request
    usage: /tpaccept [player]
    aliases: [tpyes]
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpadeny:
    description: Deny a pending TPA request
    usage: /tpadeny [player]
    aliases: [tpdeny, tpno]
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpacancel:
    description: Cancel outgoing TPA requests
    usage: /tpacancel
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpatoggle:
    description: Toggle receiving TPA requests
    usage: /tpatoggle
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpaheretoggle:
    description: Toggle receiving TPAHere requests
    usage: /tpaheretoggle
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpauto:
    description: Toggle automatic TPA acceptance
    usage: /tpauto
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  settings:
    description: Open your player settings
    usage: /settings
    aliases: [setting, prefs, preferences]
    permission: raven.settings
    permission-message: You don't have permission to use this command.
  clear:
    description: Clear your own or another player's inventory
    usage: /clear [player]
    aliases: [ci, clearinv, clearinventory]
    permission: raven.clearinventory.self
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  spawn:
    description: Open the spawn server selection menu
    usage: /spawn
    permission: raven.spawn
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  afk:
    description: Open the AFK server selection menu
    usage: /afk
    permission: raven.afk
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  setspawn:
    description: Set this server's spawn location to your current position
    usage: /setspawn
    permission: raven.setspawn
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  setafk:
    description: Set this server's AFK location to your current position
    usage: /setafk
    permission: raven.setafk
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  rtp:
    description: Teleport to a random location
    usage: /rtp
    permission: raven.rtp
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  shop:
    description: Open the server shop
    usage: /shop [category|reload]
    permission: raven.shop
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  spawner:
    description: Manage and give spawner items
    usage: /spawner <give|list|reload>
    permission: raven.spawner.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  scoreboard:
    description: Manage the Raven scoreboard
    usage: /scoreboard [toggle|on|off|list|current|select|reset|set|clear|reload]
    aliases: [sb]
    permission: raven.scoreboard
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  billford:
    description: Open the Billford trade menu
    usage: /billford
    permission: raven.billford
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  billfordpreset:
    description: Manage Billford trade presets
    usage: /billfordpreset <create|edit|delete|switch|list|info|reload> [name]
    aliases: [bfpreset]
    permission: raven.billford.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  ravencore:
    description: RavenCore version and safe module reload
    usage: /ravencore <version|modules|reload>
    aliases: [rcore]
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

permissions:
  raven.teleport:
    description: Teleport yourself or others across the network
    default: op
  raven.teleport.tpa:
    description: Use TPA requests and personal teleport settings
    default: true
  raven.settings:
    description: Open and change personal settings
    default: true
  raven.clearinventory.self:
    description: Clear your own inventory
    default: true
  raven.clearinventory.others:
    description: Clear another player's inventory
    default: op
  raven.economy.balance:
    description: Check own balance
    default: true
  raven.economy.balance.others:
    description: Check other players' balances
    default: op
  raven.economy.pay:
    description: Pay other players
    default: true
  raven.economy.admin:
    description: Admin economy commands (give, take, set, reset)
    default: op
  raven.spawn:
    description: Open the spawn server selection menu
    default: true
  raven.afk:
    description: Open the AFK server selection menu
    default: true
  raven.setspawn:
    description: Set this server's spawn location
    default: op
  raven.setafk:
    description: Set this server's AFK location
    default: op
  raven.rtp:
    description: Teleport to a random location
    default: true
  raven.shop:
    description: Open the server shop
    default: true
  raven.shop.admin:
    description: Reload the shop configuration
    default: op
  raven.spawner.admin:
    description: Manage spawner types, give spawner items, and bypass ownership checks
    default: op
  raven.spawner.silktouch:
    description: Bypass the Silk Touch requirement when breaking placed spawners
    default: op
  raven.chat:
    description: Send messages in network-wide chat
    default: true
  raven.scoreboard:
    description: Use personal scoreboard commands
    default: true
  raven.scoreboard.admin:
    description: Manage scoreboard configuration and player board selection
    default: op
  raven.core.admin:
    description: Reload RavenCore modules
    default: op
  raven.billford:
    description: Open the Billford trade menu
    default: true
  raven.billford.admin:
    description: Manage Billford trade presets
    default: op

