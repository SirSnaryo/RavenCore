name: RavenCore
version: '${version}'
main: com.kammoun.raven.RavenCore
api-version: '1.21'
folia-supported: true
softdepend: [PlaceholderAPI, WorldGuard, RavenSell, Ravs]
depend: [Vault]
load: POSTWORLD
commands:
  mythictools:
    description: Manage Mythic Tools
    usage: /mythictools <give|selfdestruct|list|reload>
    aliases: [mythictool]
    permission: raven.mythictools.admin
    permission-message: You don't have permission to use this command.
  balance:
    description: Check your balance or another player's balance
    usage: /balance [player]
    aliases: [bal, money]
    permission: raven.economy.balance
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  pay:
    description: Pay another online player
    usage: /pay <player> <amount>
    permission: raven.economy.pay
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  paytoggle:
    description: Toggle receiving player payments
    usage: /paytoggle
    permission: raven.economy.pay
    permission-message: You don't have permission to use this command.
  paymsg:
    description: Toggle economy payment messages
    usage: /paymsg
    aliases: [paymessages]
    permission: raven.economy.pay
    permission-message: You don't have permission to use this command.
  eco:
    description: Admin economy management
    usage: /eco <give|take|set|reset|log|logs> <player> [amount] [reason]
    aliases: [economy]
    permission: raven.economy.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  tp:
    description: Teleport yourself or another player to a player
    usage: /tp <player> | /tp <player> <player> | /tp <x> <y> <z> [server] | /tp <player> <x> <y> <z> [server]
    aliases: [teleport]
    permission: raven.teleport
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  tphere:
    description: Teleport a network player to you
    usage: /tphere <player>
    aliases: [tph]
    permission: raven.teleport
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.


  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpahere:
    description: Request a player to teleport to you
    usage: /tpahere <player>
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpaccept:
    description: Accept a pending TPA request
    usage: /tpaccept [player]
    aliases: [tpyes]
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpadeny:
    description: Deny a pending TPA request
    usage: /tpadeny [player]
    aliases: [tpdeny, tpno]
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpacancel:
    description: Cancel outgoing TPA requests
    usage: /tpacancel
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpatoggle:
    description: Toggle receiving TPA requests
    usage: /tpatoggle
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpaheretoggle:
    description: Toggle receiving TPAHere requests
    usage: /tpaheretoggle
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  tpauto:
    description: Toggle automatic TPA acceptance
    usage: /tpauto
    permission: raven.teleport.tpa
    permission-message: You don't have permission to use this command.

  settings:
    description: Open your player settings
    usage: /settings
    aliases: [setting, prefs, preferences]
    permission: raven.settings
    permission-message: You don't have permission to use this command.
  chattoggle:
    description: Toggle receiving public chat messages
    usage: /chattoggle
    aliases: [togglechat]
    permission: raven.chat
    permission-message: You don't have permission to use this command.
  broadcasttoggle:
    description: Toggle receiving Raven auto broadcast messages
    usage: /broadcasttoggle
    aliases: [btoggle, togglebroadcast]
    permission: raven.chat
    permission-message: You don't have permission to use this command.
  clear:
    description: Clear your own or another player's inventory
    usage: /clear [player]
    aliases: [ci, clearinv, clearinventory]
    permission: raven.clearinventory.self
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  spawn:
    description: Open the spawn server selection menu
    usage: /spawn
    permission: raven.spawn
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  afk:
    description: Open the AFK server selection menu
    usage: /afk
    permission: raven.afk
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  setspawn:
    description: Set this server's spawn location to your current position
    usage: /setspawn
    permission: raven.setspawn
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  setafk:
    description: Set this server's AFK location to your current position
    usage: /setafk
    permission: raven.setafk
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  rtp:
    description: Teleport to a random location
    usage: /rtp
    permission: raven.rtp
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  home:
    description: Open your homes or teleport to a named home
    usage: /home [name]
    permission: raven.home
    permission-message: You don't have permission to use homes.
  homes:
    description: Open your homes
    usage: /homes
    permission: raven.home
    permission-message: You don't have permission to use homes.
  sethome:
    description: Set a network-wide home
    usage: /sethome [name]
    permission: raven.home.set
    permission-message: You don't have permission to set homes.
  delhome:
    description: Delete a named home
    usage: /delhome <name>
    aliases: [deletehome, removehome]
    permission: raven.home.delete
    permission-message: You don't have permission to delete homes.

  team:
    description: Manage your network-wide team
    usage: /team [create|invite|accept|deny|leave|kick|disband|home|sethome|deletehome|chat|invites|pvp]
    aliases: [teams, clan]
    permission: raven.team
    permission-message: You don't have permission to use teams.

  combatmanager:
    description: Manage network combat tags
    usage: /combatmanager <tag|untag> <player> [opponent]
    aliases: [combatmgr, combatadmin]
    permission: raven.combat.admin
    permission-message: You don't have permission to manage combat tags.

  shop:
    description: Open the server shop
    usage: /shop [category|reload]
    permission: raven.shop
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  spawner:
    description: Manage and give spawner items
    usage: /spawner <give|list|reload>
    permission: raven.spawner.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  scoreboard:
    description: Manage the Raven scoreboard
    usage: /scoreboard [toggle|on|off|list|current|select|reset|set|clear|reload]
    aliases: [sb]
    permission: raven.scoreboard
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  billford:
    description: Open the Billford trade menu
    usage: /billford
    permission: raven.billford
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.
  billfordpreset:
    description: Manage Billford trade presets
    usage: /billfordpreset <create|edit|delete|switch|list|info|reload> [name]
    aliases: [bfpreset]
    permission: raven.billford.admin
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

  stats:
    description: View network-wide player statistics
    usage: /stats [player]
    permission: raven.stats
    permission-message: You don't have permission to view stats.
  statsmanager:
    description: Manage network-wide player statistics
    usage: /statsmanager <set|add|remove|reset|reload> [player] [stat] [amount]
    aliases: [statsadmin]
    permission: raven.stats.admin
    permission-message: You don't have permission to manage stats.
  leaderboard:
    description: Open cached network leaderboards
    usage: /leaderboard [type|refresh]
    aliases: [leaderboards, lb, top]
    permission: raven.leaderboard
    permission-message: You don't have permission to view leaderboards.

  ravencore:
    description: RavenCore version and safe module reload
    usage: /ravencore <version|modules|reload>
    aliases: [rcore]
    permission-message: §x§D§9§0§4§2§9You don't have permission to use this command.

permissions:
  raven.mythictools.admin:
    description: Manage Mythic Tools
    default: op
  raven.teleport:
    description: Teleport yourself or others across the network
    default: op
  raven.teleport.tpa:
    description: Use TPA requests and personal teleport settings
    default: true
  raven.settings:
    description: Open and change personal settings
    default: true
  raven.clearinventory.self:
    description: Clear your own inventory
    default: true
  raven.clearinventory.others:
    description: Clear another player's inventory
    default: op
  raven.economy.balance:
    description: Check own balance
    default: true
  raven.economy.balance.others:
    description: Check other players' balances
    default: op
  raven.economy.pay:
    description: Pay other players
    default: true
  raven.economy.admin:
    description: Admin economy commands (give, take, set, reset)
    default: op
  raven.economy.confirm.bypass:
    description: Bypass large payment confirmation
    default: op
  raven.economy.paytoggle.bypass:
    description: Pay players who disabled player payments
    default: op
  raven.spawn:
    description: Open the spawn server selection menu
    default: true
  raven.afk:
    description: Open the AFK server selection menu
    default: true
  raven.setspawn:
    description: Set this server's spawn location
    default: op
  raven.setafk:
    description: Set this server's AFK location
    default: op
  raven.rtp:
    description: Teleport to a random location
    default: true
  raven.home:
    description: Use and list network-wide homes
    default: true
  raven.home.set:
    description: Set network-wide homes
    default: true
  raven.home.delete:
    description: Delete network-wide homes
    default: true
  raven.home.max.1:
    description: Allow one home
    default: true
  raven.team:
    description: Use network-wide teams
    default: true
  raven.combat.admin:
    description: Manage combat tags across the network
    default: op
  raven.shop:
    description: Open the server shop
    default: true
  raven.shop.admin:
    description: Reload the shop configuration
    default: op
  raven.spawner.admin:
    description: Manage spawner types, give spawner items, and bypass ownership checks
    default: op
  raven.spawner.silktouch:
    description: Bypass the Silk Touch requirement when breaking placed spawners
    default: op
  raven.chat:
    description: Send messages in network-wide chat
    default: true
  raven.chat.link:
    description: Allow clickable/colored link formatting in chat
    default: true
  raven.chat.color:
    description: Allow color codes in chat messages
    default: op
  raven.chat.format.admin:
    description: Use the default admin chat format
    default: op
  raven.chat.bypass.toggle:
    description: Optional receive-bypass for hidden public chat when enabled in chat/config.yml
    default: false
  raven.chat.bypass.cooldown:
    description: Bypass chat cooldown checks
    default: op
  raven.chat.bypass.same:
    description: Bypass duplicate message checks
    default: op
  raven.chat.bypass.caps:
    description: Bypass caps checks
    default: op
  raven.chat.bypass.flood:
    description: Bypass flood checks
    default: op
  raven.chat.bypass.filter:
    description: Bypass configured chat filters
    default: op
  raven.chat.bypass.length:
    description: Bypass max chat length
    default: op
  raven.scoreboard:
    description: Use personal scoreboard commands
    default: true
  raven.scoreboard.admin:
    description: Manage scoreboard configuration and player board selection
    default: op
  raven.core.admin:
    description: Reload RavenCore modules
    default: op
  raven.billford:
    description: Open the Billford trade menu
    default: true
  raven.billford.admin:
    description: Manage Billford trade presets
    default: op
  raven.stats:
    description: View your own player statistics
    default: true
  raven.stats.others:
    description: View another player's statistics
    default: true
  raven.stats.admin:
    description: Manage player statistics
    default: op
  raven.leaderboard:
    description: View cached network leaderboards
    default: true
  raven.leaderboard.admin:
    description: Refresh leaderboard caches manually
    default: op

