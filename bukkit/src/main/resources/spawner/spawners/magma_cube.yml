# ─────────────────────────────────────────────────────────────────────────────
# RavenCore — Magma Cube Spawner
# Everything for this spawner type lives in this one file: its item, drops,
# and its own storage GUI. Nothing here is shared with other types.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "&7Magma Cube Spawner"

spawner-item:
  material: SPAWNER
  display-name: "&7Magma Cube Spawner"
  lore:
    - "&7Place this down for"
    - "&7a Magma Cube spawner."

gui-icon:
  material: MAGMA_CREAM
  display-name: "&7%amount% Magma Cube Spawner"
  lore:
    - "&#34ee80(%fill-percentage%% filled)"

spawn-interval-seconds: 60
xp-per-cycle: 10
max-storage: 5760

drops:
  - material: MAGMA_CREAM
    amount-per-spawner: 2
    sell-price: 1.0

# ─── Storage GUI (opened on right-click) ──────────────────────────────────────
storage-gui:
  Title: "%amount% ᴍᴀɢᴍᴀ ᴄᴜʙᴇ ѕᴘᴀᴡɴᴇʀѕ"
  Size: 54

  Items:

    Prev-Page:
      material: ARROW
      display-name: "&#34ee80ᴘʀᴇᴠɪᴏᴜs ᴘᴀɢᴇ"
      lore:
        - "&fClick to go to the previous page"
      slot: 45

    Next-Page:
      material: ARROW
      display-name: "&#34ee80ɴᴇxᴛ ᴘᴀɢᴇ"
      lore:
        - "&fClick to go to the next page"
      slot: 53

    Spawner-Icon:
      material: SPAWNER
      display-name: " "
      slot: 49

    Drop-All:
      material: DROPPER
      display-name: "&#34ee80ᴅʀᴏᴘ ᴀʟʟ ʟᴏᴏᴛ"
      lore:
        - "&fClick to drop all loot"
        - "&7All items will be dropped at your location"
      slot: 50

    Sell-All:
      material: GOLD_INGOT
      display-name: "&#34ee80ѕᴇʟʟ ᴀʟʟ"
      lore:
        - "&fClick to sell all mob drops!"
        - "&7Sells all items in storage"
      slot: 48
