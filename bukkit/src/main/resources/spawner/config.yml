# ─────────────────────────────────────────────────────────────────────────────
# RavenCore — Spawner Module Config
# ─────────────────────────────────────────────────────────────────────────────

# Maximum total spawners that can be stacked on a single block.
# e.g. 100 means one block can represent up to 100 spawners running in parallel.
max-stack: 100000

# Distance in blocks a player must be within to make a spawner tick (produce drops).
activation-radius: 25

# Show a flame particle burst when a spawner is placed.
place-particles: false

# If false, spawner blocks are removed from explosion block lists and cannot be blown up.
explosion-destroys: false

silk-touch:
  # Players must use a Silk Touch pickaxe to retrieve a placed spawner.
  required: true
  # If true, players with 'raven.spawner.silktouch' can bypass the Silk Touch requirement.
  use-permission: true

ownership:
  # If true, only the player who placed the spawner (or an admin) can break it.
  enabled: false
  # Permission node to bypass ownership check: raven.spawner.admin

# If true, natural dungeon spawners are prevented from spawning entities.
# Disable this if you want natural spawners to work normally alongside plugin spawners.
convert-natural: true

# ─── Messages ─────────────────────────────────────────────────────────────────
# Supports & color codes and &#RRGGBB hex colors.
# Placeholders vary per message (see keys below).
messages:
  no-silk:         "&cYou need Silk Touch to break this spawner!"
  # %amount% = formatted sale value
  sell-bar:        "&#38f616+$%amount%"
  sell-chat:       ""
  # %xp% = XP amount collected
  xp-collected-bar: "&#80ee0b+%xp% XP collected"
  # %total% = new stack count, %type% = spawner display name
  stacked-bar:     "&#ee340bStack is now x%total% (%type%)"
  inventory-full:  "&cYour inventory is full!"
  not-owner:       "&cYou don't own this spawner!"
  storage-in-use:  "&cSomeone else is already accessing this spawner."
  # %max% = max-stack value
  stack-limit:     "&cStack limit reached (&f%max%&c)."

# ─── Sounds ───────────────────────────────────────────────────────────────────
# Use Bukkit Sound enum names (e.g. ENTITY_VILLAGER_NO).
sounds:
  no-silk:        ENTITY_VILLAGER_NO
  page-switch:    ITEM_BOOK_PAGE_TURN
  click:          UI_BUTTON_CLICK
  inventory-full: ENTITY_VILLAGER_NO
  limit-reached:  ENTITY_VILLAGER_NO
