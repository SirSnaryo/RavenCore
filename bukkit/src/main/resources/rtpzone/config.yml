# ---------------------------------------------------------------------------
# RTP Zone
# ---------------------------------------------------------------------------
# Players who stand inside one of the WorldGuard regions below start a shared
# countdown. When it hits zero, everyone in the zone is teleported together to a
# random overworld survival server, at a random safe location.
#
# The destinations and their safe-location pools are NOT configured here — the
# zone reuses the /rtp module's `overworld-worlds` server list and its shared
# location pools (see rtp/config.yml). Requires WorldGuard. This module only
# enables on servers with server-role: spawn.
# ---------------------------------------------------------------------------

# Seconds a player must stand in the zone before the group is teleported.
timer: 30

# WorldGuard region ids that act as the RTP zone (matched case-insensitively,
# in whichever world the player is standing in).
regions:
  - rtpzone

titles:
  # Shown every second during the countdown. %time% = seconds remaining.
  countdown:
    header: "&#FF2B2B&lRTP ZONE"
    footer: "&#FFFFFFTeleporting in &#FFD447%time%&#FFFFFFs"
    fade_in: 0
    stay: 25
    fade_out: 5
  # Shown once, as the player is whisked away.
  teleported:
    header: "&#FF2B2B&lRTP ZONE"
    footer: "&#33FF66Whoosh!"
    fade_in: 10
    stay: 40
    fade_out: 10

messages:
  # Sent if no safe destination could be pulled from the pool in time.
  pool-empty: "&#D90429Couldn't find a safe destination right now — try again shortly."

sounds:
  enter:
    sound: BLOCK_BEACON_POWER_SELECT
    pitch: 0.5
    volume: 1
  countdown:
    sound: ENTITY_ENDERMAN_TELEPORT
    pitch: 1.6
    volume: 0.25
  exit:
    sound: BLOCK_BEACON_DEACTIVATE
    pitch: 0.5
    volume: 1
  teleported:
    sound: BLOCK_END_GATEWAY_SPAWN
    pitch: 0.5
    volume: 1
