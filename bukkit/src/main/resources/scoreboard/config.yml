# Raven scoreboard module.
#
# The module uses Raven's native Paper sidebar renderer inspired by TAB:
# one private objective per player, one team per line, and blank score numbers
# on modern clients through Paper NumberFormat.blank().

# Master switch. Set false to fully disable this module without removing files.
enabled: true

# Delay before creating a player's sidebar after join/switch.
# Keep this above 60 ticks when using proxy forks that handle scoreboard packets
# during server transitions.
join-delay-ticks: 80

# Main refresh loop, in ticks. 20 ticks = 1 second.
# Lines with numeric update values are refreshed on this loop only when due.
update-interval-ticks: 20

# How often Raven re-checks requirements and moves a player to a higher priority
# scoreboard if their permission/world/server state changed.
condition-check-ticks: 40

# Worlds where no Raven scoreboard should be shown.
disabled-worlds: []

scoreboards:
  # Board id. Use this name only for organization; priority decides who sees it.
  default:
    # Higher priority wins when multiple boards match the same player.
    priority: 0

    # Supports MiniMessage tags, & color codes, &#RRGGBB hex colors,
    # and PlaceholderAPI placeholders. Raven registers every %raven_*% placeholder listed below.
    # For strongest black text shadow, wrap text with <shadow:#000000FF>...</shadow>.
    title: "<shadow:#000000FF><#FF2B2B><bold>Raven SMP</bold></shadow>"

    # Requirements must all pass. Empty list means everyone can use this board.
    #
    # Supported types:
    # - permission: player must have the value permission.
    # - world: player must be in the value world.
    # - server: current Raven server-id must equal value.
    # - server-role: current Raven server-role must equal value.
    # - placeholder-equals: parsed placeholder must equal expected.
    # - placeholder-contains: parsed placeholder must contain expected.
    requirements: []

    # Lines render top to bottom. Maximum visible lines is 15.
    #
    # update modes:
    # - static: render on create/reload/board switch only.
    # - number: refresh every N ticks, for example update: 40.
    # - event:name: refresh when Raven fires that event name.
    #
    # Built-in event names:
    # - balance: fired when Raven economy receives a BalanceUpdateEvent.
    #
    # Built-in Raven PlaceholderAPI placeholders:
    # - %raven_server%
    # - %raven_server_display%
    # - %raven_role%
    # - %raven_world%
    # - %raven_online%
    # - %raven_network_online%
    # - %raven_balance% full economy format, for example 1.00 Coin.
    # - %raven_money% compact money format, for example 1$, 1k, 1.1m.
    # - %raven_ravs% compact Ravs format from the Stats Ravs bridge, for example 1k.
    # - %raven_kills%
    # - %raven_deaths%
    # - %raven_blocks_broken%
    # - %raven_blocks_placed%
    # - %raven_mob_kills%
    # - %raven_kd%
    # - %raven_money_spent%
    # - %raven_money_made%
    # - %raven_playtime%
    # - %raven_team%
    # - %raven_ping%
    # - %raven_tps% global server TPS, 1 minute average.
    # - %raven_mspt% global average MSPT.
    # - %raven_cpu% Java process CPU usage.
    # - %raven_low_tps_region% CanvasMC region TPS, first average, or N/A.
    # - %raven_mid_tps_region% CanvasMC region TPS, second average, or N/A.
    #
    # You can also use PlaceholderAPI placeholders like %player_name%.
    # Use \n inside text if you want one configured line to become multiple lines.
    #
    # Advanced TAB-style line syntax:
    # text||numberFormat||score
    # - numberFormat empty/blank/hide hides the right-side number.
    # - numberFormat default/vanilla lets the client show the score.
    # - any other numberFormat becomes fixed text on the right side.
    # - score overrides the line ordering score. Leave it empty for automatic order.
    lines:
      - text: ""
      - text: "<shadow:#000000FF><#33FF66>$ <#FFFFFF>Money <#33FF66>%raven_money%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#D90429>✦ <#FFFFFF>Ravs <#D90429>%raven_ravs%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#FF5555>🗡 <#FFFFFF>Kills <#FF5555>%raven_kills%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#FF9F1C>☠ <#FFFFFF>Deaths <#FF9F1C>%raven_deaths%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#00D5FF>⌛ <#FFFFFF>Keyall <#00D5FF>%crates_time_left%</shadow>"
        update: 60
      - text: "<shadow:#000000FF><#FFD447>☻ <#FFFFFF>Playtime <#FFD447>%raven_playtime%</shadow>"
        update: 120
      - text: "<shadow:#000000FF><#3A86FF>⚑ <#FFFFFF>Team <#3A86FF>%raven_team%</shadow>"
        update: 60
      - text: ""
      - text: "<shadow:#000000FF><#7A7A7A>%raven_server_display% <#4CC9F0>(%raven_ping%)</shadow>"
        update: 40

  admin:
    # Admin board wins over default for players with raven.scoreboard.admin.
    priority: 100
    title: "<shadow:#000000FF><#FF2B2B><bold>Raven SMP</bold></shadow>"
    requirements:
      - type: permission
        value: "raven.scoreboard.admin"
    lines:
      - text: ""
      - text: "<shadow:#000000FF><#33FF66>⚙ <#FFFFFF>TPS <#33FF66>%raven_tps%</shadow>"
        update: 20
      - text: "<shadow:#000000FF><#FF9F1C>◷ <#FFFFFF>MSPT <#FF9F1C>%raven_mspt%</shadow>"
        update: 20
      - text: "<shadow:#000000FF><#4CC9F0>⌁ <#FFFFFF>Ping <#4CC9F0>%raven_ping%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#A855F7>◆ <#FFFFFF>CPU <#A855F7>%raven_cpu%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#D90429>▼ <#FFFFFF>Low TPS Region <#D90429>%raven_low_tps_region%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#FFD447>◆ <#FFFFFF>Mid TPS Region <#FFD447>%raven_mid_tps_region%</shadow>"
        update: 40
      - text: ""
      - text: "<shadow:#000000FF><#33FF66>$ <#FFFFFF>Money <#33FF66>%raven_money%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#D90429>✦ <#FFFFFF>Ravs <#D90429>%raven_ravs%</shadow>"
        update: 40
      - text: "<shadow:#000000FF><#00D5FF>⌛ <#FFFFFF>Online <#00D5FF>%raven_network_online%</shadow>"
        update: 60
      - text: "<shadow:#000000FF><#FFD447>☻ <#FFFFFF>Playtime <#FFD447>%raven_playtime%</shadow>"
        update: 120
      - text: "<shadow:#000000FF><#3A86FF>⚑ <#FFFFFF>Team <#3A86FF>%raven_team%</shadow>"
        update: 60
      - text: ""
      - text: "<shadow:#000000FF><#7A7A7A>%raven_server_display% <#4CC9F0>(%raven_ping%)</shadow>"
        update: 40
