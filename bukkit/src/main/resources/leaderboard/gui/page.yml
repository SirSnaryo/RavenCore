Title: '&8%type% &7(Page %page%)'
Size: 54

# Short titles used to fill %type% in the Title above.
# These are independent from the display-name of the icons in menu.yml.
Titles:
  money: '&aMoney'
  kills: '&aKills'
  deaths: '&aDeaths'
  mobs-killed: '&aMobs Killed'
  blocks-broken: '&aBlocks Broken'
  blocks-placed: '&aBlocks Placed'
  play-time: '&aPlay Time'
  money-spent: '&aMoney Spent'
  sells-made: '&aSells Made'

