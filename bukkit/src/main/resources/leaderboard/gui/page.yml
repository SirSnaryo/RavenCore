Head:
  display-name: '&e#%rank% &f%name%'
  lore:
    - '&7Value: &f%value%'

Items:
  Position:
    material: PLAYER_HEAD
    slot: 48
    display-name: '&e%player%'
    lore:
      - '&f%stats_type%: &a%value%'
      - '&fRank: &a#%position%'

  Search:
    material: OAK_SIGN
    slot: 50
    display-name: '&aSearch Leaderboard'
    lore:
      - '&fClick to search for a player'

  Refresh:
    material: ANVIL
    slot: 49
    display-name: '&aRefresh'
    lore:
      - '&fClick to refresh the leaderboard'

Navigation:
  Prev:
    material: ARROW
    slot: 45
    display-name: '&aʙᴀᴄᴋ'
    lore:
      - '&fClick to go to the previous page'

  Next:
    material: ARROW
    slot: 53
    display-name: '&aɴᴇxᴛ'
    lore:
      - '&fClick to go to the next page'
