Head:
  display-name: '&#FFAA00&l#%rank% &#FFCC00%name%'
  lore:
    - '&#FFAA00▌ &#AAAAAAValue: &#FFCC00%value%'

Items:
  Position:
    material: PLAYER_HEAD
    slot: 48
    display-name: '&#FFAA00&l%player%'
    lore:
      - '&#FFAA00Information'
      - ''
      - '&#FFAA00▌ &#AAAAAARank: &#FFCC00#%position%'
      - '&#FFAA00▌ &#AAAAAA%stats_type%: &#FFCC00%value%'

  Search:
    material: OAK_SIGN
    slot: 50
    display-name: '&#00FFFF&lSEARCH LEADERBOARD'
    lore:
      - '&fLook up a specific player on this board.'
      - ''
      - '&#FFFF55▸ &#FFFF55&nCLICK&r &#00FFFFto Search'

  # Replaces Items.Search while a search is active.
  # %filter% is the current search text, %results% the number of matches.
  Search-Active:
    material: WRITABLE_BOOK
    slot: 50
    glow: true
    display-name: '&#33FF66&lSEARCH ACTIVE'
    lore:
      - '&fA name filter is currently applied to this board.'
      - ''
      - '&#55FF55✔ &#AAAAAASearching: &#55FF55%filter%'
      - '&#55FF55✔ &#AAAAAAMatches: &#55FF55%results%'
      - ''
      - '&#FFFF55▸ &#FFFF55&nLEFT-CLICK&r &#55FF55to Search Again'
      - '&#FFFF55▸ &#FFFF55&nRIGHT-CLICK&r &#55FF55to Clear Filter'

  Refresh:
    material: ANVIL
    slot: 49
    display-name: '&#33FF66&lREFRESH'
    lore:
      - '&fPull the newest leaderboard entries.'
      - ''
      - '&#FFFF55▸ &#FFFF55&nCLICK&r &#55FF55to Refresh'

Navigation:
  Prev:
    material: ARROW
    slot: 45
    display-name: '&#00FFFF&lBACK'
    lore:
      - '&fReturn to the previous page.'
      - ''
      - '&#FFFF55▸ &#FFFF55&nCLICK&r &#00FFFFfor Previous Page'

  Next:
    material: ARROW
    slot: 53
    display-name: '&#00FFFF&lNEXT'
    lore:
      - '&fContinue to the next page.'
      - ''
      - '&#FFFF55▸ &#FFFF55&nCLICK&r &#00FFFFfor Next Page'