Title: '&8%type% &7(Page %page%)'
Size: 54

# Short titles used to fill %type% in the Title above.
# These are independent from the display-name of the icons in menu.yml.
Titles:
  money: 'MONEY'
  kills: 'KILLS'
  deaths: 'DEATHS'
  mobs-killed: 'MOBS KILLED'
  blocks-broken: 'BLOCKS BROKEN'
  blocks-placed: 'BLOCKS PLACED'
  play-time: 'PLAY TIME'
  money-spent: 'MONEY SPENT'
  sells-made: 'SELLS MADE'

