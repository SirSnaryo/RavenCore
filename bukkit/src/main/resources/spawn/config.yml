# Raven GUI/message style:
# - Menu titles are forced to &8 in code; keep config titles &8 too.
# - Text supports & codes and &#RRGGBB hex colors.
# - Main palette: #FF2B2B red, #33FF66 green, #FFD447 yellow,
#   #FF9F1C orange, #4CC9F0 cyan, #7A7A7A gray, #FFFFFF white.
# - Sounds use Bukkit Sound enum names with pitch/volume numbers.

# Soft player-count cap applied to a server's SPAWN/AFK row, used for greying
# out full servers in the /spawn and /afk GUI. Only applied when a server's row
# is first created via /setspawn or /setafk — re-running either command later
# never overwrites a previously configured max_players (or enabled) value.
#
# There is currently no in-game command to change max_players/enabled on an
# existing row. To adjust one after the fact, edit it directly:
#   UPDATE ravencore_locations SET max_players = 50 WHERE server_name = '...' AND type = 'SPAWN';
default-max-players: 100

# How long (in seconds) a player waits after clicking a destination in /spawn or /afk
# before actually being teleported. Moving during the countdown cancels it. Set to 0
# to teleport instantly.
teleport-countdown:
  seconds: 5
  sounds:
    # Played once per countdown second.
    tick:
      sound: BLOCK_NOTE_BLOCK_BASS
      pitch: 0.5
      volume: 1.0
    # Played when a teleport/menu action is denied or cancelled.
    denied:
      sound: ENTITY_VILLAGER_NO
      pitch: 1.0
      volume: 1.0

# Holds a player at the stored /setafk spot. The world is taken from the stored location:
# a player who stands at the AFK spot and then walks away is teleported back, as long as
# they are still in that world. Walking into another world, or moving to another server,
# releases them. Vanished and staff mode players are never pulled.
afk-anchor:
  enabled: true
  # Distance from the AFK spot that still counts as "being at AFK".
  radius: 64
  # How far above or below the AFK spot still counts as "being at AFK". Keep this small so
  # falling off the platform is caught immediately instead of after a long drop.
  height: 16
  # Minimum seconds between two pull-backs for the same player.
  cooldown-seconds: 2
  # WorldGuard regions that count as the AFK area. While WorldGuard is installed and this
  # list is not empty, leaving one of these regions pulls you back, and the distances above
  # are ignored.
  regions:
    - afkportal
