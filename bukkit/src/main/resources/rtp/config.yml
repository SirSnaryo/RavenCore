# How long (in seconds) a player must wait between /rtp uses.
cooldown-seconds: 5

# How long (in seconds) the player must stand still, undamaged, before the
# teleport executes. 0 disables the warmup entirely.
warmup-seconds: 3
# Cancel the warmup if the player moves.
cancel-on-move: true
# Cancel the warmup if the player takes damage.
cancel-on-damage: true

pool:
  # Block types that make a candidate landing spot unsafe.
  # Note: this is layered on top of, not a replacement for, the base
  # safety checks already enforced by LocationPool (border bounds, claim
  # checks, blacklisted-blocks/blacklisted-biomes in location-library
  # config). Anything listed here is an *additional* RTP-specific
  # exclusion, useful if RTP wants stricter rules than Respawn or RTP-Zone.
  unsafe-blocks:
    - LAVA
    - WATER
    - FIRE
    - CACTUS
    - MAGMA_BLOCK
    - POWDER_SNOW
    - SWEET_BERRY_BUSH
    - WITHER_ROSE



