# RTP's own server list. Kept separate from the portal module's overworld-regions
# on purpose, so RTP's world choices/labels can diverge from portal routing.
# Each entry needs a matching server-role: survival server running this same config.
#
# X/Z SEARCH AREA: for the split overworld/nether regions the search box is taken from
# the portal module's overworld-regions (scaled 1:8 for the Nether), NOT from min/max-radius
# below — this guarantees RTP never drops a player in a neighbouring server's half of the
# shared coordinate space (which the border enforcer would then bounce them across). So
# min-radius/max-radius are IGNORED for na/eu here and only apply to the End, which is a
# single dedicated server with no border split (a small island around 0,0). min-y/max-y
# still apply everywhere (e.g. the Nether has a much lower safe build height).
overworld-worlds:
  na:
    server: smp-world-na
    display-name: "NA"
    min-radius: 500
    max-radius: 10000
    min-y: -64
    max-y: 320
  eu:
    server: smp-world-eu
    display-name: "EU"
    min-radius: 500
    max-radius: 10000
    min-y: -64
    max-y: 320

# The Nether is local to each survival server now, so it's split per-region just like the
# Overworld above — each entry points at the *same* server as its Overworld counterpart.
nether-worlds:
  na:
    server: smp-world-na
    display-name: "NA"
    min-radius: 100
    max-radius: 2500
    min-y: 32
    max-y: 120
  eu:
    server: smp-world-eu
    display-name: "EU"
    min-radius: 100
    max-radius: 2500
    min-y: 32
    max-y: 120

end:
  server: smp-end
  min-radius: 100
  max-radius: 1000
  min-y: 60
  max-y: 100

# How long (in seconds) a player must wait between /rtp uses.
cooldown-seconds: 5

pool:
  # How many safe locations to keep pre-generated and ready to hand out per server.
  target-size: 50
  # Refill back up to target-size once the pool drops to/below this size.
  refill-threshold: 15
  # How often (in seconds) to check whether the pool needs topping up. Also runs once
  # immediately on server start to build the initial pool.
  refill-interval-seconds: 30

  # Give up on a candidate x/z after this many failed safety checks and try a new one.
  max-attempts-per-location: 10

  # Block types that make a candidate landing spot unsafe.
  unsafe-blocks:
    - LAVA
    - WATER
    - FIRE
    - CACTUS
    - MAGMA_BLOCK
    - POWDER_SNOW
    - SWEET_BERRY_BUSH
    - WITHER_ROSE
