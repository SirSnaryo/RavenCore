# Keeps overworld time scoped by server role.
#
# Survival servers sync time together. Spawn servers use their own sync scope and
# keep a frozen lobby time by default.
#
# Weather is not forced every tick by default. Manual /weather commands can still
# be synced once to the matching scope.
enabled: true

# How often (in ticks) the authority broadcasts its clock. 20 ticks = 1 second. Lower it for a
# smoother mirror on followers at the cost of a little more network chatter.
broadcast-interval-ticks: 20

# How often (in seconds) each server refreshes / attempts to claim the authority election lock.
heartbeat-seconds: 5

# How long (in seconds) the authority lock survives without a refresh before another server may
# claim it. Keep this comfortably larger than heartbeat-seconds so brief hiccups don't cause the
# authority to flap between servers.
lock-ttl-seconds: 12

weather:
  sync-automatically: false
  sync-manual-commands: true

spawn:
  freeze-time: true
  default-time: 1000
  freeze-weather-cycle: true
