# Keeps the overworld time of day AND weather identical across every survival server.
#
# One server is automatically elected as the "authority": it runs the normal day/night and
# weather cycles and broadcasts them to Redis; every other survival server mirrors it and turns
# its own daylight/weather cycles off. If the authority goes down, another survival server takes
# over automatically within a few seconds.
#
# This module only enables on servers with server-role: survival.
enabled: true

# How often (in ticks) the authority broadcasts its clock. 20 ticks = 1 second. Lower it for a
# smoother mirror on followers at the cost of a little more network chatter.
broadcast-interval-ticks: 20

# How often (in seconds) each server refreshes / attempts to claim the authority election lock.
heartbeat-seconds: 5

# How long (in seconds) the authority lock survives without a refresh before another server may
# claim it. Keep this comfortably larger than heartbeat-seconds so brief hiccups don't cause the
# authority to flap between servers.
lock-ttl-seconds: 12
