# Unique name for this server on the network.
# Used as the server identifier in Redis and cross-server events.
# Dont leave it empty!
network:
  server-id: ''
  # Friendly server name shown in GUI lore/messages.
  # Example: "NA East", "SMP World NA", "Spawn".
  # Leave empty to reuse network.server-id.
  server-display-name: ''
  # Which regional cluster this server belongs to. Only meaningful for
  # server-role: survival. Used by the border system and the Location
  # Library to resolve cluster-wide requests (e.g. RTP picking any server
  # in the player's current cluster). Example: "na", "eu".
  cluster: ''
  # All regional overworld servers (NA, EU, etc.) share one world seed so terrain
  # lines up across the borders drawn by the portal module. Set this to that shared
  # seed and every server will verify its own world matches on startup — a mismatch
  # logs a severe error and shuts the server down instead of starting with broken
  # terrain at the border. Leave empty to skip this check.
  expected-seed: ''

# server-role options:
#   survival — normal survival world plus its own local Nether (default)
#   end      — dedicated End server; all non-THE_END worlds are unloaded
#   spawn    — lobby/spawn server; no gameplay modules loaded
server-role: survival

redis:
  host: '172.18.0.2'
  port: 6379
  password: 'v9OvHKGQ3EXLqE0F'
  database: 0


# MySQL connection used by network-wide persistent features (e.g. /setspawn, /setafk).
database:
  host: 172.18.0.1
  port: 3306
  name: s10_SMP_DATABASE
  user: u10_Y8LJHuTiM8
  password: 'D@o!DfVIJPOA9DnPGmF9o@Xh'

# Virtual grid placement for this server, only used when server-role: survival.
# Defines the exact slice of the shared coordinate space this server owns —
# read by the border-crossing listener, the portal interceptor, and the
# Location Library's pool generation (locations are never generated outside
# this box).
grid:
  # Size of one grid cell in blocks, per edge, measured in Overworld
  # coordinates. Nether cell size is this value divided by nether-ratio.
  # Must be identical across every server in the network.
  cell-size: 50000
  # Shared grid origin in Overworld coordinates. With the default values below,
  # cell 0:0 owns X/Z -25000..25000, so 0,0 is centered inside server 1.
  # Server 2 east should use cell-x: 1 and keeps the same origin.
  origin-x: -25000
  origin-z: -25000
  # Overworld:Nether coordinate ratio. Vanilla default is 8. Only change
  # this if you're running a modified Nether scale.
  nether-ratio: 8
  # This server's position within its cluster's grid, in cell units (not
  # blocks). E.g. cell-x: 0, cell-z: 0 is the first 50k square; cell-x: 1 is
  # the next square to the east, etc.
  cell-x: 0
  cell-z: 0
  # How many blocks of buffer to keep between any RTP-generated location
  # and this cell's true border, in every direction. Prevents a random
  # teleport from landing close enough to immediately re-trigger a
  # border-crossing transfer, and stops Location Library pools from ever
  # spilling coordinates into a neighboring server's territory.
  border-safety-margin: 300

# Virtual border settings (applies to all derived region borders).
border:
  # Visual particle wall. Disable this if network/profiler packet counters climb
  # too high near borders; border protection and transfer still work.
  particles:
    enabled: true
    render-period-ticks: 40
  # How close (in blocks) a player must be to see the particle wall.
  detection-distance: 10
  # Tiny safety epsilon used only when the exact crossing coordinate lands on
  # the destination cell edge. Keep this small so border transfers preserve the
  # player's real crossing position instead of feeling like a jump.
  arrival-inset-blocks: 0.01
  # When Continuum keeps the client world during a server switch, entities from
  # the previous server can remain as frozen client-side ghosts. RavenCore hides
  # nearby old entities right before the transfer; the destination server then
  # sends the real entities again.
  cleanup-client-entities-on-transfer: true
  # Radius around the crossing player to clear from the old client view.
  # Increase only if players use a very high server/client view distance.
  cleanup-client-entities-radius: 48.0
  # Maximum entities hidden before one transfer. Higher values can cause client
  # FPS drops on mob-heavy borders.
  cleanup-client-entities-max: 64
  # Hard cap per player render tick. Keeps the visual wall visible without
  # tanking client FPS when a player stands exactly on the edge.
  max-particles-per-render: 18
  # Vertical/horizontal spacing between particle rows in the wall.
  particle-spacing: 6.0
  # How many blocks tall the particle wall is.
  wall-height: 8
  # Any Bukkit Particle enum value.
  particle: DUST_PLUME
  # Sent when a player tries to break or place a block past the border.
  deny-message: ""

# Cross-server Ender Pearl stasis chambers settings.
pearl-stasis:
  # Whether cross-server stasis handling is enabled.
  enabled: true
  # Prints branch-level diagnostics when a pearl is ignored or waits for a pending record.
  # Keep false in production unless you are debugging a pearl that does not transfer.
  debug: false
  # Logs successful recorded/applied cross-server stasis landings.
  log-transfers: true
  # False means MySQL stasis records stay saved until the player consumes them.
  # Keep this false for real pearl stasis chambers.
  expire-pending-records: false
  # Used only when expire-pending-records is true. 0 means never expire.
  pending-record-ttl-seconds: 0
  sound:
    name: ENTITY_ENDERMAN_TELEPORT
    pitch: 1.75
    volume: 0.9

# Native, unpassable border used only by survival servers on the true outer
# ring of the complete map. Interior servers leave this disabled.
world-border:
  enabled: false
  huge-size: 2000000
  damage-amount: 0.2
  damage-buffer: 5.0
  warning-distance: 5
  warning-time: 15
  # Ring servers add only the edges their cell actually touches:
  # true-edges:
  #   north: -225000
  #   west: -225000
