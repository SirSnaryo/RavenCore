  tpa-auto-toggle-on: "&#55FF55✔ TPAuto enabled. Requests will auto-accept."
  tpa-auto-toggle-off: "&#FF4D4D✕ TPAuto disabled."

  tpa-toggle-on-actionbar: "&#55FF55✔ TPA requests enabled."
  tpa-toggle-off-actionbar: "&#FF4D4D✕ TPA requests disabled."
  tpa-here-toggle-on-actionbar: "&#55FF55✔ TPAHere requests enabled."
  tpa-here-toggle-off-actionbar: "&#FF4D4D✕ TPAHere requests disabled."
  tpa-auto-toggle-on-actionbar: "&#55FF55✔ TPAuto enabled."
