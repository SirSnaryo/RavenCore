# Raven teleport module.
#
# TPA settings are stored in MySQL in raven_teleport_settings, so player
# toggles survive leaving the server and work across the whole network.
# Server names shown in menus use bukkit/config.yml -> network.server-display-name.

confirm-menu:
  enabled: true

data:
  # Seconds before a pending TPA request expires.
  clear-time: 120
  # Seconds a player must wait before sending another TPA/TPAHere request.
  request-cooldown: 5

teleport-countdown:
  # Countdown after a TPA request is accepted. Moving cancels it.
  seconds: 5

world-nicknames:
  world: Overworld
  world_nether: Nether
  world_the_end: End

sounds:
  information-click:
    sound: ENTITY_ENDERMAN_TELEPORT
    pitch: 1.75
    volume: 0.9
  request-cancelled:
    sound: ENTITY_VILLAGER_NO
    pitch: 1.0
    volume: 1.0
  error:
    sound: ENTITY_VILLAGER_NO
    pitch: 0.85
    volume: 1.0
  toggle:
    sound: UI_BUTTON_CLICK
    pitch: 1.35
    volume: 1.0
  accept-teleport:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    pitch: 1.35
    volume: 1.0
  count-down:
    sound: BLOCK_NOTE_BLOCK_PLING
    pitch: 1.9
    volume: 0.85

messages:
  user-not-found: "&#FF4D4D✕ Player &f%player% &#FF4D4Dis not online."
  self-teleport: "&#FF4D4D✕ You cannot teleport to yourself."
  non-valid-request: "&#FF4D4D✕ Teleport request does not exist."
  no-requests-found: "&#FF4D4D✕ You do not have any teleport requests."

  accepted-teleport: "&#55FF55✔ You accepted this teleport request."
  target-accepted-teleport: "&#55FF55✔ &f%player% &#55FF55accepted your teleport request."

  receive-request: "&#00FFFF▸ &f%player% &#00FFFFsent you a TPA request.\n<click:run_command:/tpaccept %player%><hover:show_text:'&#55FF55Accept request'>&#55FF55[CLICK TO ACCEPT]</hover></click> &#555555| <click:run_command:/tpadeny %player%><hover:show_text:'&#FF4D4DDeny request'>&#FF4D4D[DENY]</hover></click>\n&#FF4D4D✕ This teleport request might be a trap."
  receive-here-request: "&#00FFFF▸ &f%player% &#00FFFFsent you a TPAHere request.\n<click:run_command:/tpaccept %player%><hover:show_text:'&#55FF55Accept request'>&#55FF55[CLICK TO ACCEPT]</hover></click> &#555555| <click:run_command:/tpadeny %player%><hover:show_text:'&#FF4D4DDeny request'>&#FF4D4D[DENY]</hover></click>\n&#FF4D4D✕ This teleport request might be a trap."

  sent-request: "&#00FFFF▸ You sent &f%player% &#00FFFFa TPA request. &#FF4D4DBe careful: this can be a trap."
  sent-here-request: "&#00FFFF▸ You sent &f%player% &#00FFFFa TPAHere request."
  tpa-request-sender-actionbar: "&#00FFFFWaiting for &f%player% &#00FFFFto accept."
  tpa-here-request-sender-actionbar: "&#00FFFFWaiting for &f%player% &#00FFFFto accept."
  tpa-request-target-actionbar: "&f%player% &#00FFFFsent you a TPA request."
  tpa-here-request-target-actionbar: "&f%player% &#00FFFFsent you a TPAHere request."

  cancelled-request: "&#FF4D4D✕ You declined &f%player%&#FF4D4D's request."
  cancelled-request-sender: "&#FF4D4D✕ &f%player% &#FF4D4Ddeclined your teleport request."
  block-tpa-request: "&#FF4D4D✕ That player is not accepting TPA requests."
  block-tphere-request: "&#FF4D4D✕ That player is not accepting TPAHere requests."
  request-cooldown: "&#FF4D4D✕ Please wait before sending another request to &f%player%&#FF4D4D."
  cancel-requests: "&#55FF55✔ Cancelled your outgoing teleport requests."
  cancel-requests-failed: "&#FF4D4D✕ You do not have outgoing teleport requests."

  teleport-countdown: "&#00FFFFTeleporting in &f%time%s&#00FFFF... Don't move!"
  teleport-countdown-actionbar: "&#00FFFFTeleporting in &f%time%s&#00FFFF..."
  teleport-cancelled: "&#FF4D4D✕ Teleport has been cancelled."
  teleport-movement-cancellation-action-bar: "&#FF4D4D✕ Teleport cancelled — you moved."

  tpa-toggle-on: "&#55FF55✔ You are now accepting TPA requests. &#AAAAAAUse /tpaheretoggle for TPAHere."
  tpa-toggle-off: "&#FF4D4D✕ You are no longer accepting TPA requests."
  tpa-here-toggle-on: "&#55FF55✔ You are now accepting TPAHere requests."
