# Raven teleport module.
#
# TPA settings are stored in MySQL in raven_teleport_settings, so player
# toggles survive leaving the server and work across the whole network.
# Server names shown in menus use bukkit/config.yml -> network.server-display-name.

confirm-menu:
  enabled: true

data:
  # Seconds before a pending TPA request expires.
  clear-time: 120
  # Seconds a player must wait before sending another TPA/TPAHere request.
  request-cooldown: 5

teleport-countdown:
  # Countdown after a TPA request is accepted. Moving cancels it.
  seconds: 5

world-nicknames:
  world: Overworld
  world_nether: Nether
  world_the_end: End

sounds:
  information-click:
    sound: ENTITY_ENDERMAN_TELEPORT
    pitch: 1.75
    volume: 0.9
  request-cancelled:
    sound: ENTITY_VILLAGER_NO
    pitch: 1.0
    volume: 1.0
  error:
    sound: ENTITY_VILLAGER_NO
    pitch: 0.85
    volume: 1.0
  toggle:
    sound: UI_BUTTON_CLICK
    pitch: 1.35
    volume: 1.0
  accept-teleport:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    pitch: 1.35
    volume: 1.0
  count-down:
    sound: BLOCK_NOTE_BLOCK_PLING
    pitch: 1.9
    volume: 0.85

messages:
  user-not-found: "&#D90429Player &#FFD447%player% &#D90429is not online."
  self-teleport: "&#D90429You cannot teleport to yourself."
  non-valid-request: "&#D90429Teleport request does not exist."
  no-requests-found: "&#D90429You do not have any teleport requests."

  accepted-teleport: "&#33FF66You accepted this teleport request."
  target-accepted-teleport: "&#FFD447%player% &#33FF66accepted your teleport request."

  receive-request: "&#4CC9F0%player% &#FFFFFFsent you a TPA request.\n<click:run_command:/tpaccept %player%><hover:show_text:'&#33FF66Accept request'>&#33FF66[CLICK TO ACCEPT]</hover></click> &#7A7A7A| <click:run_command:/tpadeny %player%><hover:show_text:'&#D90429Deny request'>&#D90429[DENY]</hover></click>\n&#D90429This teleport request might be a trap."
  receive-here-request: "&#4CC9F0%player% &#FFFFFFsent you a TPAHere request.\n<click:run_command:/tpaccept %player%><hover:show_text:'&#33FF66Accept request'>&#33FF66[CLICK TO ACCEPT]</hover></click> &#7A7A7A| <click:run_command:/tpadeny %player%><hover:show_text:'&#D90429Deny request'>&#D90429[DENY]</hover></click>\n&#D90429This teleport request might be a trap."

  sent-request: "&#7A7A7AYou sent &#4CC9F0%player% &#7A7A7Aa TPA request. &#D90429Be careful: this can be a trap."
  sent-here-request: "&#7A7A7AYou sent &#4CC9F0%player% &#7A7A7Aa TPAHere request."
  tpa-request-sender-actionbar: "&#7A7A7AWaiting for &#4CC9F0%player% &#7A7A7Ato accept."
  tpa-here-request-sender-actionbar: "&#7A7A7AWaiting for &#4CC9F0%player% &#7A7A7Ato accept."
  tpa-request-target-actionbar: "&#4CC9F0%player% &#7A7A7Asent you a TPA request."
  tpa-here-request-target-actionbar: "&#4CC9F0%player% &#7A7A7Asent you a TPAHere request."

  cancelled-request: "&#D90429You declined &#FFD447%player%&#D90429's request."
  cancelled-request-sender: "&#FFD447%player% &#D90429declined your teleport request."
  block-tpa-request: "&#D90429That player is not accepting TPA requests."
  block-tphere-request: "&#D90429That player is not accepting TPAHere requests."
  request-cooldown: "&#D90429Please wait before sending another request to &#FFD447%player%&#D90429."
