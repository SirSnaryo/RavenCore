# Raven teleport module.
#
# TPA settings are stored in MySQL in raven_teleport_settings, so player
# toggles survive leaving the server and work across the whole network.
# Cross-server teleports are prepared in Redis with a short TTL before Velocity
# moves the player, then the target Bukkit server consumes the payload on join.

confirm-menu:
  enabled: true

data:
  # Seconds before a pending TPA request expires.
  clear-time: 120

teleport-countdown:
  # Reserved for delayed teleport flows. Admin /tp stays instant.
  seconds: 5

world-nicknames:
  world: Overworld
  world_nether: Nether
  world_the_end: End

sounds:
  information-click:
    sound: ENTITY_ENDERMAN_TELEPORT
    pitch: 1.75
    volume: 0.85
  request-cancelled:
    sound: ENTITY_VILLAGER_NO
    pitch: 1.0
    volume: 1.0
  error:
    sound: ENTITY_VILLAGER_NO
    pitch: 0.85
    volume: 1.0
  toggle:
    sound: UI_BUTTON_CLICK
    pitch: 1.35
    volume: 1.0
  accept-teleport:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    pitch: 1.25
    volume: 1.0
  count-down:
    sound: BLOCK_NOTE_BLOCK_PLING
    pitch: 1.8
    volume: 1.0

