combat:
  duration: 30
  kill-on-logout: true
  disable-elytra: true
  disable-enderpearls: true
  # RavenCore keeps pearls usable in combat so stasis/cross-server pearl systems work.
  # Set this false only if you want vanilla pearl teleports blocked during combat.
  allow-enderpearls-in-combat: true
  worldguard-block: true
  ignore-op: false
  actionbar:
    enabled: true
    message: '&c⚔ In combat for &e%time%s'

blocked-commands:
  - spawn
  - home
  - homes
  - sethome
  - delhome
  - tpa
  - tpahere
  - tpaccept
  - tp
  - tphere
  - rtp
  - afk

messages:
  prefix: ''
  enter-combat: '&#FF4D4D⚔ You are now in combat!'
  leave-combat: '&#55FF55✔ You are no longer in combat.'
  blocked-command: '&#FF4D4D✕ You cannot use &f/%command% &#FF4D4Dwhile in combat!'
  transfer-blocked: '&#FF4D4D✕ You cannot change servers or dimensions while in combat!'
  elytra-blocked: '&#FF4D4D✕ You cannot use Elytra during combat!'
  enderpearl-blocked: '&#FF4D4D✕ You cannot use Ender Pearls during combat!'
  region-blocked: '&#FF4D4D✕ You cannot enter protected areas while in combat!'
  logout-death: '&#FF4D4D☠ &f%player% &#FF4D4Dlogged out during combat!'
